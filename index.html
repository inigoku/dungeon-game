<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2a0a10" />
    <meta name="application-name" content="Dungeon Explorer 2D" />
    <meta name="apple-mobile-web-app-title" content="Dungeon Explorer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Explora la mazmorra, encuentra la salida y sobrevive." />
    <title>Dungeon Explorer 2D</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #ddd;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        touch-action: none; /* el arrastre con el dedo mueve al personaje, no hace scroll */
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
      #overlay[hidden] {
        display: none;
      }
      #version {
        position: absolute;
        bottom: 10px;
        font-size: 11px;
        color: #555;
      }
      #overlay h1 {
        margin: 0;
        font-size: clamp(22px, 5vw, 38px);
        letter-spacing: 0.06em;
        color: #d4af37;
      }
      #overlay p {
        margin: 0;
        color: #aaa;
      }
      #bar {
        width: min(60%, 320px);
        height: 6px;
        background: #222;
        border-radius: 3px;
        overflow: hidden;
      }
      #bar > div {
        height: 100%;
        width: 0;
        background: #8a1c1c;
        transition: width 0.15s;
      }
      #action {
        font: inherit;
        padding: 10px 22px;
        color: #fff;
        background: #4a0e0e;
        border: 2px solid #962020;
        border-radius: 4px;
        cursor: pointer;
      }
      #action:hover,
      #action:focus-visible {
        background: #6a1414;
      }
      /* Controles táctiles: solo en pantallas táctiles */
      #touch {
        display: none;
      }
      @media (pointer: coarse) {
        html,
        body {
          touch-action: manipulation;
          -webkit-user-select: none;
          user-select: none;
        }
        #stage {
          width: 100vw;
          height: calc(100dvh - 84px);
        }
        #touch {
          display: flex;
          justify-content: flex-end;
          align-items: center;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          height: 76px;
          padding: 0 16px env(safe-area-inset-bottom);
          box-sizing: border-box;
        }
      }
      #side {
        display: grid;
        grid-template-columns: repeat(3, 56px);
        gap: 8px;
      }
      #touch button {
        font: inherit;
        font-size: 22px;
        color: #fff;
        background: #2a1010;
        border: 2px solid #6a1818;
        border-radius: 10px;
        touch-action: manipulation;
      }
      #touch button:active {
        background: #6a1414;
      }
      /* Cruceta adaptativa: aparece bajo el dedo (cuadrante inferior izquierdo) mientras se mantiene pulsado */
      .apad {
        position: absolute;
        width: 150px;
        height: 150px;
        margin: -75px 0 0 -75px;
        border-radius: 50%;
        background: rgba(20, 6, 6, 0.45);
        border: 2px solid rgba(150, 32, 32, 0.7);
        pointer-events: none;
      }
      .apad[hidden] {
        display: none;
      }
      .apad-arrow {
        position: absolute;
        width: 40px;
        height: 40px;
        line-height: 40px;
        text-align: center;
        font-size: 24px;
        color: rgba(255, 255, 255, 0.55);
        border-radius: 10px;
      }
      .apad-arrow.on {
        color: #fff;
        background: rgba(150, 32, 32, 0.8);
      }
      .apad-N { left: 55px; top: 6px; }
      .apad-S { left: 55px; bottom: 6px; }
      .apad-O { left: 6px; top: 55px; }
      .apad-E { right: 6px; top: 55px; }

      /* Hoja de personaje (estilo juego de rol de mesa) */
      #sheet {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 10px;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.78);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #sheet[hidden] {
        display: none;
      }
      .sheet-paper {
        position: relative;
        width: min(760px, 100%);
        box-sizing: border-box;
        padding: 14px 14px 18px;
        color: #2c1d10;
        font-family: Georgia, 'Palatino Linotype', 'Times New Roman', serif;
        background: radial-gradient(ellipse at 30% 10%, #f6e9c8 0%, #ebd8a8 55%, #d9bf86 100%);
        border: 4px double #7a1f1f;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), inset 0 0 50px rgba(120, 80, 30, 0.35);
      }
      .sheet-close {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 38px;
        height: 38px;
        font: 20px/1 Georgia, serif;
        color: #f6e9c8;
        background: #7a1f1f;
        border: 2px solid #4a0e0e;
        border-radius: 50%;
        cursor: pointer;
      }
      .sheet-head {
        display: flex;
        gap: 12px;
        align-items: center;
        padding-right: 44px;
        border-bottom: 3px double #7a1f1f;
        padding-bottom: 10px;
        margin-bottom: 10px;
      }
      .sheet-portrait {
        flex: none;
        width: 106px;
        height: 130px;
        border: 3px solid #7a1f1f;
        border-radius: 60px 60px 8px 8px;
        background: #e9d5a4;
      }
      .sheet-title {
        flex: 1;
        min-width: 0;
      }
      .sheet-class {
        font-size: 12px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #7a1f1f;
      }
      .sheet-name {
        font-size: clamp(20px, 5vw, 30px);
        font-weight: bold;
        line-height: 1.1;
        margin: 2px 0 8px;
      }
      .sheet-fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 4px 10px;
        margin: 0;
      }
      .sheet-fields div {
        border-bottom: 1px solid #8a6a3a;
      }
      .sheet-fields dt,
      .sheet-notes dt {
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #7a1f1f;
      }
      .sheet-fields dd,
      .sheet-notes dd {
        margin: 0;
        font-size: 14px;
      }
      .sheet-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .sheet-wide {
        grid-column: 1 / -1;
      }
      @media (max-width: 560px) {
        .sheet-grid {
          grid-template-columns: 1fr;
        }
        .sheet-portrait {
          width: 84px;
          height: 104px;
        }
      }
      .sheet-col h3 {
        margin: 12px 0 4px;
        padding-bottom: 2px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #7a1f1f;
        border-bottom: 1px solid #7a1f1f;
      }
      .sheet-abilities {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 8px;
      }
      .sheet-ability {
        text-align: center;
        padding: 4px 2px 0;
        background: #f3e4bd;
        border: 2px solid #7a1f1f;
        border-radius: 10px;
      }
      .sheet-ability-name {
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7a1f1f;
      }
      .sheet-ability-mod {
        font-size: 24px;
        font-weight: bold;
        line-height: 1.1;
      }
      .sheet-ability-score {
        display: inline-block;
        min-width: 32px;
        margin: 0 0 -9px;
        padding: 1px 6px;
        font-size: 13px;
        background: #f6e9c8;
        border: 2px solid #7a1f1f;
        border-radius: 50%;
      }
      .sheet-box,
      .sheet-shield {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 5px 4px;
        text-align: center;
        background: #f3e4bd;
        border: 2px solid #7a1f1f;
        border-radius: 8px;
      }
      .sheet-shield {
        border-radius: 8px 8px 50% 50%;
      }
      .sheet-box-value {
        font-size: 20px;
        font-weight: bold;
        line-height: 1.1;
      }
      .sheet-box-label {
        font-size: 8.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7a1f1f;
      }
      .sheet-vitals,
      .sheet-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 8px;
      }
      .sheet-row {
        grid-template-columns: 1fr 1fr;
      }
      .sheet-hp {
        margin-bottom: 8px;
        padding: 6px;
        text-align: center;
        background: #f3e4bd;
        border: 2px solid #7a1f1f;
        border-radius: 8px;
      }
      .sheet-hp-label {
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #7a1f1f;
      }
      .sheet-hp-value {
        font-size: 28px;
        font-weight: bold;
        line-height: 1.1;
      }
      .sheet-hearts {
        min-height: 20px;
        font-size: 20px;
        letter-spacing: 0.15em;
        color: #a01818;
      }
      .sheet-list,
      .sheet-plain {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 13px;
      }
      .sheet-list li {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 1px 0;
        border-bottom: 1px dotted #a98b57;
      }
      .sheet-list small {
        color: #7a5a2a;
        font-size: 10px;
      }
      .sheet-plain li {
        padding: 2px 0 2px 14px;
        position: relative;
      }
      .sheet-plain li::before {
        content: '◆';
        position: absolute;
        left: 0;
        font-size: 8px;
        top: 6px;
        color: #7a1f1f;
      }
      .sheet-dot {
        flex: none;
        width: 9px;
        height: 9px;
        border: 1.5px solid #7a1f1f;
        border-radius: 50%;
        background: transparent;
      }
      .sheet-dot.on {
        background: #7a1f1f;
      }
      .sheet-attacks {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      .sheet-attacks th {
        font-size: 9px;
        letter-spacing: 0.1em;
        text-align: left;
        text-transform: uppercase;
        color: #7a1f1f;
      }
      .sheet-attacks td {
        padding: 2px 4px 2px 0;
        border-bottom: 1px dotted #a98b57;
      }
      .sheet-power {
        margin-top: 6px;
        padding: 5px 8px;
        font-size: 12px;
        font-style: italic;
        background: rgba(122, 31, 31, 0.1);
        border-left: 3px solid #7a1f1f;
      }
      .sheet-notes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 4px 14px;
        margin: 0;
      }
      .sheet-notes div {
        padding-bottom: 3px;
        border-bottom: 1px solid #8a6a3a;
      }

      /* Selector de clase en la pantalla de inicio */
      #classes {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        max-width: 100%;
      }
      #classes[hidden] {
        display: none;
      }
      #classes button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 10px 6px;
        min-width: 92px;
        font: inherit;
        font-size: 14px;
        color: #ccc;
        background: #140a0a;
        border: 2px solid #4a2020;
        border-radius: 8px;
        cursor: pointer;
      }
      #classes button.on {
        color: #fff;
        background: #3a1010;
        border-color: #d4af37;
      }
      #classes canvas {
        width: 66px;
        height: 80px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="630" height="630"></canvas>
      <div id="overlay">
        <h1 id="overlay-title">Dungeon Explorer 2D</h1>
        <p id="overlay-text">Cargando recursos…</p>
        <div id="bar"><div id="bar-fill"></div></div>
        <div id="classes" role="radiogroup" aria-label="Clase" hidden></div>
        <button id="action" type="button" hidden>Empezar</button>
        <div id="version"></div>
      </div>
    </div>
    <div id="touch" aria-label="Controles táctiles">
      <div id="side">
        <button data-key="c" aria-label="Hoja de personaje">☰</button>
        <button data-key="r" aria-label="Reiniciar">↻</button>
        <button data-key="Escape" aria-label="Salir">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4" />
            <path d="M16 8l4 4-4 4" />
            <path d="M20 12H9" />
          </svg>
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

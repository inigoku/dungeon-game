<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Dungeon Explorer 2D</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #ddd;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        touch-action: none; /* el arrastre con el dedo mueve al personaje, no hace scroll */
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
      #overlay[hidden] {
        display: none;
      }
      #overlay h1 {
        margin: 0;
        font-size: clamp(22px, 5vw, 38px);
        letter-spacing: 0.06em;
        color: #d4af37;
      }
      #overlay p {
        margin: 0;
        color: #aaa;
      }
      #bar {
        width: min(60%, 320px);
        height: 6px;
        background: #222;
        border-radius: 3px;
        overflow: hidden;
      }
      #bar > div {
        height: 100%;
        width: 0;
        background: #8a1c1c;
        transition: width 0.15s;
      }
      #action {
        font: inherit;
        padding: 10px 22px;
        color: #fff;
        background: #4a0e0e;
        border: 2px solid #962020;
        border-radius: 4px;
        cursor: pointer;
      }
      #action:hover,
      #action:focus-visible {
        background: #6a1414;
      }
      /* Controles táctiles: solo en pantallas táctiles */
      #touch {
        display: none;
      }
      @media (pointer: coarse) {
        html,
        body {
          touch-action: manipulation;
          -webkit-user-select: none;
          user-select: none;
        }
        #stage {
          width: 100vw;
          height: calc(100dvh - 84px);
        }
        #touch {
          display: flex;
          justify-content: flex-end;
          align-items: center;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          height: 76px;
          padding: 0 16px env(safe-area-inset-bottom);
          box-sizing: border-box;
        }
      }
      #side {
        display: grid;
        grid-template-columns: repeat(2, 56px);
        gap: 8px;
      }
      #touch button {
        font: inherit;
        font-size: 22px;
        color: #fff;
        background: #2a1010;
        border: 2px solid #6a1818;
        border-radius: 10px;
        touch-action: manipulation;
      }
      #touch button:active {
        background: #6a1414;
      }
      /* Cruceta adaptativa: aparece bajo el dedo (cuadrante inferior izquierdo) mientras se mantiene pulsado */
      .apad {
        position: absolute;
        width: 150px;
        height: 150px;
        margin: -75px 0 0 -75px;
        border-radius: 50%;
        background: rgba(20, 6, 6, 0.45);
        border: 2px solid rgba(150, 32, 32, 0.7);
        pointer-events: none;
      }
      .apad[hidden] {
        display: none;
      }
      .apad-arrow {
        position: absolute;
        width: 40px;
        height: 40px;
        line-height: 40px;
        text-align: center;
        font-size: 24px;
        color: rgba(255, 255, 255, 0.55);
        border-radius: 10px;
      }
      .apad-arrow.on {
        color: #fff;
        background: rgba(150, 32, 32, 0.8);
      }
      .apad-N { left: 55px; top: 6px; }
      .apad-S { left: 55px; bottom: 6px; }
      .apad-O { left: 6px; top: 55px; }
      .apad-E { right: 6px; top: 55px; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="630" height="630"></canvas>
      <div id="overlay">
        <h1 id="overlay-title">Dungeon Explorer 2D</h1>
        <p id="overlay-text">Cargando recursos…</p>
        <div id="bar"><div id="bar-fill"></div></div>
        <button id="action" type="button" hidden>Empezar</button>
      </div>
    </div>
    <div id="touch" aria-label="Controles táctiles">
      <div id="side">
        <button data-key="Escape" aria-label="Menú">☰</button>
        <button data-key="r" aria-label="Reiniciar">↻</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

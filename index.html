<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Dungeon Explorer 2D</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #ddd;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: min(100vw, 100vh);
        height: min(100vw, 100vh);
        margin: 0 auto;
        top: calc((100vh - min(100vw, 100vh)) / 2);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
      #overlay[hidden] {
        display: none;
      }
      #overlay h1 {
        margin: 0;
        font-size: clamp(22px, 5vw, 38px);
        letter-spacing: 0.06em;
        color: #d4af37;
      }
      #overlay p {
        margin: 0;
        color: #aaa;
      }
      #bar {
        width: min(60%, 320px);
        height: 6px;
        background: #222;
        border-radius: 3px;
        overflow: hidden;
      }
      #bar > div {
        height: 100%;
        width: 0;
        background: #8a1c1c;
        transition: width 0.15s;
      }
      #action {
        font: inherit;
        padding: 10px 22px;
        color: #fff;
        background: #4a0e0e;
        border: 2px solid #962020;
        border-radius: 4px;
        cursor: pointer;
      }
      #action:hover,
      #action:focus-visible {
        background: #6a1414;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="630" height="630"></canvas>
      <div id="overlay">
        <h1 id="overlay-title">Dungeon Explorer 2D</h1>
        <p id="overlay-text">Cargando recursos…</p>
        <div id="bar"><div id="bar-fill"></div></div>
        <button id="action" type="button" hidden>Empezar</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
